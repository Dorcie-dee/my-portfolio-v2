name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC: catch newly published advisories
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Blocking: production dependencies ship to users.
      # yarn audit exits with a severity bitmask (1 info, 2 low, 4 moderate, 8 high, 16 critical);
      # --level only filters the report, so check the high and critical bits explicitly.
      - name: Audit production dependencies (fails on high or critical)
        run: |
          status=0
          yarn audit --groups dependencies --level high || status=$?
          if (( status & 24 )); then
            echo "::error title=Production dependency audit::High or critical advisories found in production dependencies."
            exit 1
          fi

      # Non-blocking but visible: dev tooling (lint, types, build) does not ship to users.
      # Newly added vulnerable dev dependencies are still blocked by the dependency-review job.
      - name: Audit development dependencies (report only)
        run: |
          status=0
          yarn audit --groups devDependencies --level high || status=$?
          if (( (status & 24) == 0 )); then
            echo "No high or critical advisories in development dependencies." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Dev dependency advisories::High or critical advisories found in development dependencies. See the step log. This check does not block merging."
            {
              echo "### :warning: Development dependency advisories"
              echo "High or critical advisories were found in development-only dependencies."
              echo "They are reported but do not block merging. Review the step log for details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
